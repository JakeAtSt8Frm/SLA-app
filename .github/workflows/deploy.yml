name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    # Both projection sources revise throughout the preseason.
    - cron: '17 10 * * *'
  # Lets you redeploy by hand from the Actions tab.
  workflow_dispatch:

# Standard Pages deployment permissions.
permissions:
  contents: read
  pages: write
  id-token: write

# Never run two deploys at once; let an in-flight one finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # These are pinned to majors that run on Node 24. Older majors still work
      # but the runner forces them onto Node 24 and emits a deprecation warning.
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # Neither source allows browser CORS, so normalize their public projection
      # pages into the static artifact at build time. They refresh as separate
      # steps so one site being down does not cost us the other's update, and
      # the checked-in snapshots are the fallback either way.
      - run: npm run refresh:fftoday
        continue-on-error: true

      - run: npm run refresh:sharks
        continue-on-error: true

      # Catches a source silently changing its columns before a degraded
      # snapshot can reach the build.
      - run: npm run verify:projections

      - run: npm run verify:power

      - run: npm run verify:matchup

      - run: npm run build

      # Requires Pages to already be enabled on the repo with the "GitHub
      # Actions" source. The action's `enablement` input can turn it on
      # automatically, but only with a PAT — the default GITHUB_TOKEN is not
      # permitted to, so enabling it once by hand is the simpler path.
      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
